name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the trailing comment); Dependabot keeps them current.
jobs:
  verify:
    name: Typecheck, unit + integration tests (coverage), build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quartermaster
          POSTGRES_PASSWORD: quartermaster
          POSTGRES_DB: quartermaster_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quartermaster"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://quartermaster:quartermaster@localhost:5432/quartermaster_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm --filter @qm/web test
      - name: OpenAPI and Postman are up to date
        run: pnpm docs:api && git diff --exit-code -- docs/openapi.json postman/
      - run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  postgres:
    name: Full integration suite on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quartermaster
          POSTGRES_PASSWORD: quartermaster
          POSTGRES_DB: quartermaster_harness
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quartermaster"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Every harness runs against real PostgreSQL (row locks, advisory locks, READ COMMITTED).
      HARNESS_DATABASE_URL: postgres://quartermaster:quartermaster@localhost:5432/quartermaster_harness
      TEST_DATABASE_URL: postgres://quartermaster:quartermaster@localhost:5432/quartermaster_harness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Files share one database, so they run one at a time.
      - run: pnpm vitest run tests/integration --no-file-parallelism

  e2e:
    name: Browser journeys (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_PASSWORD: ci-demo-password-for-e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high

  docker:
    name: API container builds and migrates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t quartermaster-api .
      - name: Migrations apply inside the image
        run: docker run --rm -e NODE_ENV=development -e DATABASE_URL=pglite:///tmp/pg quartermaster-api node dist/migrate.js
