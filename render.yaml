# Render Blueprint — Quartermaster AI + TrustRail
# https://render.com/docs/blueprint-spec
#
# This describes the live deployment: web and API on Starter instances (no cold start), Postgres
# on a paid plan, and the sweeper running inside the API (no separate cron service).
#
# quartermaster-web        Next.js interface (public)
# quartermaster-api        Express API: TrustRail + protected PayPal gateway (public, for PayPal
#                          webhooks); also runs the sweeper (payment reconciliation, certificate
#                          expiry, retention purges, health monitors) every SWEEPER_INTERVAL_SECONDS
# quartermaster-postgres   System of record
#
# Start commands are a single `node` process (no `sh -c "… && …"`), so Render's SIGTERM reaches
# the server and it drains in-flight requests (research runs take up to ~45 s) before exiting.
# Memory flags are on the start command rather than NODE_OPTIONS, because NODE_OPTIONS would also
# cap the build (`pnpm install`, `next build`).

databases:
  - name: quartermaster-postgres
    plan: basic-256mb
    databaseName: quartermaster
    user: quartermaster
    postgresMajorVersion: "17"
    ipAllowList: [] # private network only

services:
  - type: web
    name: quartermaster-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @qm/api build
    # Migrations (under a PostgreSQL advisory lock), then the shared sample workspace and operator
    # accounts if they are missing (idempotent; never resets). A failure here aborts the deploy and
    # the previous release keeps serving. The server itself does not migrate (MIGRATE_ON_BOOT).
    preDeployCommand: node apps/api/dist/migrate.js && node apps/api/dist/seed.js
    startCommand: node --max-old-space-size=384 --enable-source-maps apps/api/dist/server.js
    healthCheckPath: /readyz
    # SIGTERM → drain for up to SHUTDOWN_GRACE_MS (60 s) → exit; Render waits up to 90 s.
    maxShutdownDelaySeconds: 90
    # Deploy only after GitHub checks (CI) pass on the commit.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Browser traffic arrives as client → Render edge → quartermaster-web (Next.js rewrite,
      # appends the edge address to X-Forwarded-For) → API, so two hops are trusted to make
      # req.ip the browser's address for the per-IP rate limits. Caveat: this service is also
      # public (for PayPal webhooks); a client calling it directly can prepend one forged
      # X-Forwarded-For entry. If that matters, set TRUST_PROXY to the private-network subnets
      # instead (e.g. "10.0.0.0/8") or expose only /api/v1/webhooks publicly.
      - key: TRUST_PROXY
        value: "2"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: quartermaster-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: disable # internal connection on Render's private network
      - key: DATABASE_ALLOW_INSECURE_TRANSPORT
        value: "true" # production refuses DATABASE_SSL=disable without this explicit opt-in
      # The hosted demo uses the simulated "mark delivered" actions (off by default in production).
      - key: ALLOW_SYNTHETIC_DELIVERY_ACTIONS
        value: "true"
      - key: APP_BASE_URL
        sync: false # e.g. https://quartermaster-web.onrender.com
      # The API runs the sweeper itself; /readyz reports its liveness and monitor.sweeper_stale
      # alerts when no sweep has succeeded for 3 × this interval.
      - key: SWEEPER_INTERVAL_SECONDS
        value: "120"
      - key: MIGRATE_ON_BOOT
        value: "false" # the pre-deploy command migrates
      - key: RETENTION_DAYS
        value: "90"
      - key: TRUSTRAIL_SIGNING_KEY_ID
        sync: false
      - key: TRUSTRAIL_SIGNING_KEY
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: ZAPIER_WEBHOOK_URL
        sync: false
      # zapier | email | both. Unset: both with RESEND_API_KEY and a Zapier URL, email with only
      # RESEND_API_KEY, otherwise zapier. Email goes to each workspace's owners.
      - key: NOTIFY_CHANNEL
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
      # Accounts: open sign-up; email for invitations and password resets (Resend or a JSON webhook).
      - key: SIGNUP_ENABLED
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      # A sender on a domain verified in Resend, e.g. "Quartermaster <notifications@your-domain>".
      - key: EMAIL_FROM
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      # Monitoring: operators see /system; alerts go by email and/or a Slack-style webhook.
      - key: OPERATOR_EMAILS
        sync: false
      - key: ALERT_EMAILS
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: quartermaster-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @qm/web build
    # `next start` straight from node (it listens on $PORT), so SIGTERM is not swallowed by pnpm.
    startCommand: node --max-old-space-size=384 apps/web/node_modules/next/dist/bin/next start apps/web
    healthCheckPath: /login
    maxShutdownDelaySeconds: 90
    # Deploy only after GitHub checks (CI) pass on the commit.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: API_HOSTPORT
        fromService:
          type: web
          name: quartermaster-api
          property: hostport

# A separate cron job (`node apps/api/dist/sweep.js`, every 5 minutes, with the API's database,
# signing-key and PayPal variables) can run the sweeper instead: set SWEEPER_INTERVAL_SECONDS=0 on
# the API (the staleness limit then defaults to 15 minutes, three missed runs).
