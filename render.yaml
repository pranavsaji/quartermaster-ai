# Render Blueprint — Quartermaster AI + TrustRail
# https://render.com/docs/blueprint-spec
#
# quartermaster-web        Next.js interface (public)
# quartermaster-api        Express API: TrustRail + protected PayPal gateway (public, for PayPal webhooks)
# quartermaster-sweeper    Cron: payment reconciliation, certificate expiry, purges
# quartermaster-postgres   System of record

databases:
  - name: quartermaster-postgres
    plan: basic-256mb
    databaseName: quartermaster
    user: quartermaster
    postgresMajorVersion: "17"
    ipAllowList: [] # private network only

services:
  - type: web
    name: quartermaster-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @qm/api build
    preDeployCommand: node apps/api/dist/migrate.js
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /readyz
    # Deploy only after GitHub checks (CI) pass on the commit.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Browser traffic arrives as client → Render edge → quartermaster-web (Next.js rewrite,
      # appends the edge address to X-Forwarded-For) → API, so two hops are trusted to make
      # req.ip the browser's address for the per-IP rate limits. Caveat: this service is also
      # public (for PayPal webhooks); a client calling it directly can prepend one forged
      # X-Forwarded-For entry. If that matters, set TRUST_PROXY to the private-network subnets
      # instead (e.g. "10.0.0.0/8") or expose only /api/v1/webhooks publicly.
      - key: TRUST_PROXY
        value: "2"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: quartermaster-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: disable # internal connection on Render's private network
      - key: DATABASE_ALLOW_INSECURE_TRANSPORT
        value: "true" # production refuses DATABASE_SSL=disable without this explicit opt-in
      # The hosted demo uses the simulated "mark delivered" actions (off by default in production).
      - key: ALLOW_SYNTHETIC_DELIVERY_ACTIONS
        value: "true"
      - key: APP_BASE_URL
        sync: false # e.g. https://quartermaster-web.onrender.com
      - key: SWEEPER_INTERVAL_SECONDS
        value: "0" # the cron job below runs the sweeper
      - key: TRUSTRAIL_SIGNING_KEY_ID
        sync: false
      - key: TRUSTRAIL_SIGNING_KEY
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: ZAPIER_WEBHOOK_URL
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false

  - type: web
    name: quartermaster-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @qm/web build
    startCommand: pnpm --filter @qm/web start
    healthCheckPath: /login
    # Deploy only after GitHub checks (CI) pass on the commit.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: API_HOSTPORT
        fromService:
          type: web
          name: quartermaster-api
          property: hostport

  - type: cron
    name: quartermaster-sweeper
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @qm/api build
    startCommand: node apps/api/dist/sweep.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: quartermaster-postgres
          property: connectionString
      # Production defaults to DATABASE_SSL=require; match the API's private-network setting.
      - key: DATABASE_SSL
        value: disable
      - key: DATABASE_ALLOW_INSECURE_TRANSPORT
        value: "true"
      - key: TRUSTRAIL_SIGNING_KEY_ID
        sync: false
      - key: TRUSTRAIL_SIGNING_KEY
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Required in production whenever PayPal credentials are set.
      - key: PAYPAL_MERCHANT_ID
        sync: false
