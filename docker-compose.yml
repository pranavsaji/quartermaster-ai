# Local PostgreSQL 17 for running the API or the integration suite against a real server:
#   docker compose up -d
#   DATABASE_URL=postgres://quartermaster:quartermaster@localhost:5432/quartermaster pnpm db:seed
#   HARNESS_DATABASE_URL=postgres://quartermaster:quartermaster@localhost:5432/quartermaster pnpm vitest run tests/integration --no-file-parallelism
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quartermaster
      POSTGRES_PASSWORD: quartermaster
      POSTGRES_DB: quartermaster
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quartermaster"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
